name: neuriplo
role: backend-orchestrator

default_branches:
  integration: develop
  release: master

entrypoints:
  configure:
    - cmake -S . -B build -DBUILD_INFERENCE_ENGINE_TESTS=ON
  build:
    - cmake --build build
  # Valid without a NERT fixture: NertInferTest is registered only when
  # -DNERT_FIXTURE=<path> is set, so the fixture-free default has no entry to
  # fail or skip.
  test:
    - ctest --test-dir build --output-on-failure
  backend_matrix:
    - ./scripts/test_backends.sh
  quality:
    - ./scripts/quality/run.sh
    - ./scripts/quality/format.sh --check
    - ./scripts/quality/cppcheck.sh
    - ./scripts/quality/sanitizers.sh
    - ./scripts/quality/setup_hooks.sh

owned_paths:
  - backends/
  - cmake/
  - scripts/
  - docs/
  - specs/
  - include/
  - src/
  - versions.env
  - AGENTS.md

allowed_change_classes:
  - ci-triage
  - dependency-sync
  - backend-config-fix
  - docs-sync

forbidden_change_classes:
  - inference-logic-change
  - perf-critical-kernel-change
  - new-dependency

constraints:
  # The 2026-10-22 develop default switch to NERT is a deliberate exception;
  # explicit backend selection and the existing registry behavior are preserved.
  preserve_backend_selection_behavior: true
  preserve_device_placement_expectations: true
  review_runtime_version_changes: mandatory
  protect_fallback_behavior: true
