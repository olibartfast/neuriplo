name: SDK base images

# Publishes version-pinned SDK base images (e.g. litert-deps) to GHCR so that
# per-PR CI jobs skip source builds of third-party SDKs. Per-run jobs resolve
# the base with a pull-or-fallback step (see ci.yml); this workflow only
# builds and pushes. Its own layer cache lives in the registry, never in GHA,
# so base builds add no pressure to the 10 GB budget (see cache-prune.yml).

on:
  push:
    branches: [develop, master, 'release/**', 'feature/**']
    paths:
      - docker/Dockerfile.litert
      - docker/Dockerfile.tvm
      - docker/Dockerfile.llamacpp
      - docker/Dockerfile.libtensorflow
      - scripts/setup_litert.sh
      - scripts/lib/version_stamp.sh
      - versions.env
      - .github/workflows/base-images.yml
  # schedule: only fires once this file reaches the default branch (master,
  # release-only). The push trigger above is what refreshes bases on develop
  # in the meantime. Weekly cadence picks up upstream Ubuntu security updates.
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  litert-deps:
    name: litert-deps base image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Read LiteRT pin
        id: pin
        run: |
          set -euo pipefail
          VER="$(grep -E '^LITERT_VERSION=' versions.env | cut -d= -f2)"
          if [ -z "$VER" ]; then
            echo "LITERT_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push litert-deps
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          command: |
            docker buildx build \
              --file docker/Dockerfile.litert \
              --target litert-deps \
              --tag ghcr.io/${{ github.repository }}/litert-deps:${{ steps.pin.outputs.version }} \
              --push \
              --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/litert-deps:buildcache \
              --cache-to type=registry,ref=ghcr.io/${{ github.repository }}/litert-deps:buildcache,mode=max \
              .

  tvm-deps:
    name: tvm-deps base image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Read TVM pin
        id: pin
        run: |
          set -euo pipefail
          VER="$(grep -E '^TVM_VERSION=' versions.env | cut -d= -f2)"
          if [ -z "$VER" ]; then
            echo "TVM_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push tvm-deps
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 240
          max_attempts: 2
          command: |
            docker buildx build \
              --file docker/Dockerfile.tvm \
              --target tvm_install \
              --tag ghcr.io/${{ github.repository }}/tvm-deps:${{ steps.pin.outputs.version }} \
              --push \
              --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/tvm-deps:buildcache \
              --cache-to type=registry,ref=ghcr.io/${{ github.repository }}/tvm-deps:buildcache,mode=max \
              .

  llamacpp-deps:
    name: llamacpp-deps base image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Read llama.cpp pin
        id: pin
        run: |
          set -euo pipefail
          VER="$(grep -E '^LLAMACPP_VERSION=' versions.env | cut -d= -f2)"
          if [ -z "$VER" ]; then
            echo "LLAMACPP_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push llamacpp-deps
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          command: |
            docker buildx build \
              --file docker/Dockerfile.llamacpp \
              --target llamacpp_install \
              --tag ghcr.io/${{ github.repository }}/llamacpp-deps:${{ steps.pin.outputs.version }} \
              --push \
              --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/llamacpp-deps:buildcache \
              --cache-to type=registry,ref=ghcr.io/${{ github.repository }}/llamacpp-deps:buildcache,mode=max \
              .

  tensorflow-deps:
    name: tensorflow-deps base image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Read TensorFlow pin
        id: pin
        run: |
          set -euo pipefail
          VER="$(grep -E '^TENSORFLOW_VERSION=' versions.env | cut -d= -f2)"
          if [ -z "$VER" ]; then
            echo "TENSORFLOW_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push tensorflow-deps
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          command: |
            docker buildx build \
              --file docker/Dockerfile.libtensorflow \
              --target tensorflow_install \
              --tag ghcr.io/${{ github.repository }}/tensorflow-deps:${{ steps.pin.outputs.version }} \
              --push \
              --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/tensorflow-deps:buildcache \
              --cache-to type=registry,ref=ghcr.io/${{ github.repository }}/tensorflow-deps:buildcache,mode=max \
              .
