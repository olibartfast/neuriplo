name: CI

on:
  push:
    branches: [master, develop, 'release/**', 'feature/**', 'refactor/**']
  pull_request:
    branches: [master, develop, 'release/**', 'feature/**']

# github.ref differs between the two events that can start this workflow for
# one branch -- refs/heads/<branch> on push, refs/pull/<n>/merge on
# pull_request -- so keying on it put the two in separate groups and ran the
# whole matrix twice for every branch with an open PR. head_ref is the branch
# name on pull_request and empty on push, so this collapses both onto the
# branch name and lets cancel-in-progress do its job.
#
# The head repository is part of the key too: two PRs from different forks can
# share a branch name, and keying on the name alone would let one cancel the
# other's whole matrix. github.event.pull_request is null on push, so that
# falls back to this repository.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:

  # =============================================================
  # Whole-tree checks (no backend SDK needed)
  # =============================================================

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: ./scripts/quality/format.sh --check

  backend-docs-check:
    name: Backend Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated sections are up to date
        run: |
          pip install pyyaml --quiet
          python3 scripts/gen_backend_docs.py --check

  # Catches a std symbol used without the header that declares it -- the class
  # of bug that only shows up on the strictest toolchain in the matrix, and
  # then 30 minutes in, one backend at a time. Needs no compiler and no SDKs,
  # so it lands its verdict in the first few seconds of the run.
  include-audit:
    name: Include Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for std symbols used without their header
        run: python3 scripts/quality/check_includes.py

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          # TestTemplateCompileTest.cpp is excluded: cppcheck cannot expand
          # gmock's MOCK_METHOD. Without the gmock headers it reports a syntax
          # error in that file; with them, one inside gmock's own preprocessor
          # machinery. It is compiled and run by ctest instead.
          cppcheck --enable=warning --std=c++17 --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -i backends/src/test/TestTemplateCompileTest.cpp \
            -I include -I backends/src \
            src/ backends/

  # =============================================================
  # Per-backend lint checks (run inside the backend Docker image)
  # =============================================================

  clang-tidy:
    name: "Clang-Tidy / ${{ matrix.backend }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { backend: OPENCV_DNN,    dockerfile: docker/Dockerfile.opencvdnn }
          - { backend: ONNX_RUNTIME,  dockerfile: docker/Dockerfile.onnx-runtime }
          - { backend: LIBTORCH,      dockerfile: docker/Dockerfile.libtorch }
          - { backend: LIBTENSORFLOW, dockerfile: docker/Dockerfile.libtensorflow }
          - { backend: OPENVINO,      dockerfile: docker/Dockerfile.openvino }
          - { backend: GGML,          dockerfile: docker/Dockerfile.ggml }
          - { backend: TVM,           dockerfile: docker/Dockerfile.tvm }
          - { backend: MIGRAPHX,      dockerfile: docker/Dockerfile.migraphx }
          - { backend: TENSORRT,      dockerfile: docker/Dockerfile.tensorrt, cmake_args: -DTENSORRT_DIR=/opt/tensorrt }
          - { backend: LITERT,        dockerfile: docker/Dockerfile.litert }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file ${{ matrix.dockerfile }} \
              --target builder \
              --tag neuriplo-lint:${{ matrix.backend }} \
              --load \
              --cache-from type=gha,scope=docker-${{ matrix.backend }} \
              ${{ github.event_name == 'push' && format('--cache-to type=gha,mode=max,scope=docker-{0}', matrix.backend) || '' }} \
              .

      - name: Run clang-tidy
        run: |
          docker run --rm neuriplo-lint:${{ matrix.backend }} bash -c '
            apt-get update && apt-get install -y clang-tidy-18 >/dev/null 2>&1
            cmake -B/app/build -S/app \
              -DDEFAULT_BACKEND=${{ matrix.backend }} \
              ${{ matrix.cmake_args || '' }} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON >/dev/null 2>&1
            python3 -c "
          import json, subprocess, sys
          db = json.load(open(\"/app/build/compile_commands.json\"))
          files = [e[\"file\"] for e in db]
          rc = subprocess.run([\"clang-tidy-18\", \"-p\", \"/app/build\"] + files).returncode
          sys.exit(rc)
            "
          '

  build-warnings:
    name: "Werror / ${{ matrix.backend }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { backend: OPENCV_DNN,    dockerfile: docker/Dockerfile.opencvdnn }
          - { backend: ONNX_RUNTIME,  dockerfile: docker/Dockerfile.onnx-runtime }
          - { backend: LIBTORCH,      dockerfile: docker/Dockerfile.libtorch }
          - { backend: LIBTENSORFLOW, dockerfile: docker/Dockerfile.libtensorflow }
          - { backend: OPENVINO,      dockerfile: docker/Dockerfile.openvino }
          - { backend: GGML,          dockerfile: docker/Dockerfile.ggml }
          - { backend: TVM,           dockerfile: docker/Dockerfile.tvm }
          - { backend: MIGRAPHX,      dockerfile: docker/Dockerfile.migraphx }
          - { backend: TENSORRT,      dockerfile: docker/Dockerfile.tensorrt, cmake_args: -DTENSORRT_DIR=/opt/tensorrt }
          - { backend: LITERT,        dockerfile: docker/Dockerfile.litert }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file ${{ matrix.dockerfile }} \
              --target builder \
              --tag neuriplo-lint:${{ matrix.backend }} \
              --load \
              --cache-from type=gha,scope=docker-${{ matrix.backend }} \
              ${{ github.event_name == 'push' && format('--cache-to type=gha,mode=max,scope=docker-{0}', matrix.backend) || '' }} \
              .

      - name: Rebuild with -Werror
        run: |
          docker run --rm neuriplo-lint:${{ matrix.backend }} bash -c '
            cmake -B/app/build -S/app \
              -DDEFAULT_BACKEND=${{ matrix.backend }} \
              ${{ matrix.cmake_args || '' }} \
              -DWERROR=ON >/dev/null 2>&1
            cmake --build /app/build --clean-first --parallel
          '

  sanitizers:
    name: "Sanitizers / ${{ matrix.backend }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { backend: OPENCV_DNN,    dockerfile: docker/Dockerfile.opencvdnn,      test_exe: OCVDNNInferTest }
          - { backend: ONNX_RUNTIME,  dockerfile: docker/Dockerfile.onnx-runtime,   test_exe: ONNXRuntimeInferTest }
          - { backend: LIBTORCH,      dockerfile: docker/Dockerfile.libtorch,        test_exe: LibtorchInferTest }
          # LIBTENSORFLOW excluded: absl headers fail to compile in Debug+sanitizer mode
          # OPENVINO excluded: TBB loads libtbbbind with RTLD_DEEPBIND, incompatible with ASan
          - { backend: GGML,          dockerfile: docker/Dockerfile.ggml,            test_exe: GGMLInferTest }
          - { backend: TVM,           dockerfile: docker/Dockerfile.tvm,             test_exe: TVMInferTest }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file ${{ matrix.dockerfile }} \
              --target builder \
              --tag neuriplo-lint:${{ matrix.backend }} \
              --load \
              --cache-from type=gha,scope=docker-${{ matrix.backend }} \
              ${{ github.event_name == 'push' && format('--cache-to type=gha,mode=max,scope=docker-{0}', matrix.backend) || '' }} \
              .

      - name: Rebuild with sanitizers and run tests
        run: |
          docker run --rm neuriplo-lint:${{ matrix.backend }} bash -c '
            # Ensure OpenVINO runtime libs are discoverable (harmless for other backends)
            export LD_LIBRARY_PATH=/opt/openvino/runtime/lib/intel64:${LD_LIBRARY_PATH:-}
            cmake -B/app/build -S/app \
              -DDEFAULT_BACKEND=${{ matrix.backend }} \
              ${{ matrix.cmake_args || '' }} \
              -DSANITIZERS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_INFERENCE_ENGINE_TESTS=ON \
              -DNEURIPLO_REQUIRE_GMOCK=ON >/dev/null 2>&1
            cmake --build /app/build --clean-first --parallel
            export LSAN_OPTIONS=suppressions=/app/scripts/quality/lsan-suppressions.txt:print_suppressions=0
            ctest --test-dir /app/build --output-on-failure
          '

  # =============================================================
  # Consumer C ABI (specs/2026-09-25-consumer-c-abi, [T-19])
  # ASan needs no job of its own: the sanitizers job's full ctest already
  # runs every CApi* case ([D-21]).
  # =============================================================
  capi-consumer:
    name: "C ABI / symbols + consumer proof"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file docker/Dockerfile.opencvdnn \
              --target builder \
              --tag neuriplo-lint:OPENCV_DNN \
              --load \
              --cache-from type=gha,scope=docker-OPENCV_DNN \
              ${{ github.event_name == 'push' && '--cache-to type=gha,mode=max,scope=docker-OPENCV_DNN' || '' }} \
              .

      - name: Symbol check, consumer proof, Python ctypes
        run: |
          docker run --rm neuriplo-lint:OPENCV_DNN bash -c '
            set -euo pipefail
            cd /app
            rm -rf build-capi
            cmake -S . -B build-capi -DDEFAULT_BACKEND=OPENCV_DNN \
              -DBUILD_INFERENCE_ENGINE_TESTS=ON -DWERROR=ON >/dev/null
            cmake --build build-capi --parallel
            ctest --test-dir build-capi -R "CApi|PluginAbi" --output-on-failure
            ./scripts/abi/check_symbols.sh build-capi
            # Both directions of drift must fail ([V-11]).
            # (explicit ifs: set -e ignores a failing "! cmd").
            if ./scripts/abi/check_symbols.sh build-capi <(grep -v "^neuriplo_infer$" scripts/abi/neuriplo_c.symbols); then
              echo "negative symbol check passed unexpectedly (unlisted export)"; exit 1
            fi
            if ./scripts/abi/check_symbols.sh build-capi <(cat scripts/abi/neuriplo_c.symbols; echo neuriplo_not_exported); then
              echo "negative symbol check passed unexpectedly (missing export)"; exit 1
            fi
            # C, C++ (CMake package and pkg-config) and Python ctypes against
            # an installed prefix ([V-12], [V-13]).
            ./test/consumer/run.sh build-capi
          '

  capi-tsan:
    name: "C ABI / TSan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file docker/Dockerfile.opencvdnn \
              --target builder \
              --tag neuriplo-lint:OPENCV_DNN \
              --load \
              --cache-from type=gha,scope=docker-OPENCV_DNN \
              ${{ github.event_name == 'push' && '--cache-to type=gha,mode=max,scope=docker-OPENCV_DNN' || '' }} \
              .

      # Recent runner kernels randomise mmap beyond what TSan's shadow layout
      # accepts; containers share the host kernel, so lower it on the host.
      - name: Make the kernel TSan-compatible
        if: ${{ !env.ACT }}
        run: sudo sysctl vm.mmap_rnd_bits=28

      # TSan re-execs itself with personality(ADDR_NO_RANDOMIZE), which
      # Docker's default seccomp profile rejects ("CHECK failed:
      # tsan_platform_linux.cpp ... personality"); this throwaway test
      # container runs unconfined.
      - name: TSan on the Thread and Log cases (no suppressions, [D-17])
        run: |
          docker run --rm --security-opt seccomp=unconfined neuriplo-lint:OPENCV_DNN bash -c '
            set -euo pipefail
            apt-get update >/dev/null && apt-get install -y clang-18 >/dev/null
            cd /app
            rm -rf build-capi-tsan
            CC=clang-18 CXX=clang++-18 cmake -S . -B build-capi-tsan -DDEFAULT_BACKEND=OPENCV_DNN \
              -DBUILD_INFERENCE_ENGINE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
              "-DCMAKE_C_FLAGS=-fsanitize=thread -g" "-DCMAKE_CXX_FLAGS=-fsanitize=thread -g" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread \
              -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread >/dev/null
            cmake --build build-capi-tsan --parallel
            TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-capi-tsan -R "^CApi\.(Thread|Log)\." --output-on-failure
          '

  # =============================================================
  # CPU Backend Tests
  # Runs on GitHub-hosted runners using Docker.
  # =============================================================
  build-and-test-cpu:
    name: "${{ matrix.backend }}"
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - backend: OPENCV_DNN
            dockerfile: docker/Dockerfile.opencvdnn
            image: neuriplo-opencvdnn
            test_exe: OCVDNNInferTest

          - backend: GGML
            dockerfile: docker/Dockerfile.ggml
            image: neuriplo-ggml
            test_exe: GGMLInferTest

          - backend: OPENVINO
            dockerfile: docker/Dockerfile.openvino
            image: neuriplo-openvino
            test_exe: OpenVINOInferTest

          - backend: ONNX_RUNTIME
            dockerfile: docker/Dockerfile.onnx-runtime
            image: neuriplo-onnxruntime
            test_exe: ONNXRuntimeInferTest

          - backend: LIBTENSORFLOW
            dockerfile: docker/Dockerfile.libtensorflow
            image: neuriplo-libtensorflow
            test_exe: TensorFlowInferTest

          - backend: TVM
            dockerfile: docker/Dockerfile.tvm
            image: neuriplo-tvm
            test_exe: TVMInferTest

          - backend: LIBTORCH
            dockerfile: docker/Dockerfile.libtorch
            image: neuriplo-libtorch-cpu
            test_exe: LibtorchInferTest

          - backend: CACTUS
            dockerfile: docker/Dockerfile.cactus
            image: neuriplo-cactus
            test_exe: CactusInferTest
            runs_on: ubuntu-24.04-arm
          - backend: LLAMACPP
            dockerfile: docker/Dockerfile.llamacpp
            image: neuriplo-llamacpp
            test_exe: LlamaCppInferTest

          - backend: LITERT
            dockerfile: docker/Dockerfile.litert
            image: neuriplo-litert
            test_exe: LiteRTInferTest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file ${{ matrix.dockerfile }} \
              --tag ${{ matrix.image }}:ci \
              --load \
              --cache-from type=gha,scope=docker-${{ matrix.backend }} \
              ${{ github.event_name == 'push' && format('--cache-to type=gha,mode=max,scope=docker-{0}', matrix.backend) || '' }} \
              .

      - name: Run tests
        run: |
          docker run --rm \
            ${{ matrix.image }}:ci \
            bash -c "
              EXE=\$(find /app -name '${{ matrix.test_exe }}' -type f -executable | head -1)
              if [ -z \"\$EXE\" ]; then
                echo 'ERROR: Test executable ${{ matrix.test_exe }} not found'
                find /app -type f -executable | head -20
                exit 1
              fi
              echo \"Running: \$EXE\"
              \"\$EXE\"
            "

  # =============================================================
  # GPU Backend Builds (build-only, no GPU required)
  # Verifies that GPU backends compile successfully using Docker.
  # Tests are skipped — they require a real GPU (see build-and-test-gpu).
  # =============================================================
  build-tensorrt:
    name: TENSORRT build-only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            docker buildx build \
              --file docker/Dockerfile.tensorrt \
              --tag neuriplo-tensorrt:ci \
              --cache-from type=gha,scope=docker-TENSORRT \
              ${{ github.event_name == 'push' && '--cache-to type=gha,mode=max,scope=docker-TENSORRT' || '' }} \
              .

  # =============================================================
  # ExecuTorch Build (build-only — tests use mock inference, but
  # model export requires Python torch install done separately)
  # =============================================================
  build-executorch:
    name: EXECUTORCH build-only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ !env.ACT }}
        uses: ./.github/actions/free-disk-space

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-retry

      - name: Build Docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          command: |
            docker buildx build \
              --file docker/Dockerfile.executorch \
              --tag neuriplo-executorch:ci \
              --cache-from type=gha,scope=docker-EXECUTORCH \
              ${{ github.event_name == 'push' && '--cache-to type=gha,mode=max,scope=docker-EXECUTORCH' || '' }} \
              .

  # ── Cache budget ───────────────────────────────────────────────────────────
  # The six jobs above are the ones that write `--cache-to type=gha,mode=max`,
  # and between them they exported 8.3 GB of BuildKit layer blobs -- the whole
  # of the repository's 10 GB cache budget. GitHub then evicted by least recent
  # use and took the Windows vcpkg archives with it, turning a 58s
  # `Windows / OPENCV_DNN` back into a ~40 minute build of OpenCV from source.
  #
  # Trim right where the pressure is made, rather than on a schedule: a
  # `schedule:` trigger only fires from the default branch, which is `master`
  # and release-only, so a scheduled-only prune would sit dormant on `develop`
  # for as long as a release takes.
  #
  # if: always() because the blobs are written whether or not the build that
  # wrote them passed, and only on push because that is the event `--cache-to`
  # is gated on above.
  prune-caches:
    name: Prune BuildKit caches
    needs:
      - clang-tidy
      - build-warnings
      - sanitizers
      - build-and-test-cpu
      - build-tensorrt
      - build-executorch
    if: always() && github.event_name == 'push'
    permissions:
      actions: write
    uses: ./.github/workflows/cache-prune.yml
